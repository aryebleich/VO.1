# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: quantpocket
    runtime: docker
    rootDir: web
    plan: starter
    disk: { name: data, mountPath: /app/data, sizeGB: 1 }
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: PUBLIC_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ALPACA_KEY_ID, sync: false }
      - { key: ALPACA_SECRET, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_PRICE_PRO, sync: false }
      - { key: STRIPE_PRICE_ELITE, sync: false }
