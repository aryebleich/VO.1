name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project
        run: |
          npx --yes create-expo-app@latest app --template blank
          cd app
          npx expo install expo-secure-store expo-crypto expo-local-authentication react-native-svg react-native-safe-area-context expo-status-bar
          cp ../App.js ./App.js
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("app.json"));j.expo.android={...j.expo.android,package:"com.quantpocket.app"};fs.writeFileSync("app.json",JSON.stringify(j,null,2))'
          npx expo prebuild --platform android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/android/app/build/outputs/apk/release/*.apk
