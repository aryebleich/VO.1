# Free hosts put idle apps to sleep. This wakes the app every 10 minutes and runs due jobs
# (scheduled trades, bots, price alerts), plus a daily equity snapshot after the US close.
# Setup: repository variable APP_URL and repository secret CRON_SECRET (same value as on the host).
name: App scheduler
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due jobs
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set; skipping."; exit 0; fi
          q=""; if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ]; then q="?snapshot=1"; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/internal/tick$q"
